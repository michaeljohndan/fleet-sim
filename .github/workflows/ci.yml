name: CI

on:
  push:
  pull_request:
  workflow_dispatch: # "Run workflow" button: runs the full matrix incl. macOS

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'workflow_dispatch'
          && fromJSON('["ubuntu-latest","windows-latest","macos-latest"]')
          || fromJSON('["ubuntu-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash # Git Bash on the Windows runner
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format, lint, and test
        run: scripts/check.sh

      - name: Deep randomized run
        if: matrix.os == 'ubuntu-latest'
        run: FLEET_SIM_SEEDS=2000 cargo test --release --test simulation