name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash # Git Bash on the Windows runner
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format, lint, and test
        run: scripts/check.sh

      - name: Deep randomized run
        run: FLEET_SIM_SEEDS=2000 cargo test --release --test simulation